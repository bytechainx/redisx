[package]
name = "redisx"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Async Redis adapter with standalone, cluster and sentinel topologies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/redisx"
homepage = "https://github.com/bytechainx/redisx"
documentation = "https://github.com/bytechainx/redisx#readme"
readme = "README.md"
keywords = ["redis", "cache", "key-value", "async", "cluster"]
categories = ["caching", "database", "asynchronous"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "benches/**/*", "docs/**/*", "README.md", "CHANGELOG.md", "CONTEXT.md", "CONTRIBUTING.md", "LICENSE-*", "Cargo.toml"]

[features]
default = ["pubsub"]
# 可选原始 Pub/Sub 会话（RedisPubSub / RedisPubSubMessage）。
pubsub = []

[dependencies]
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
redis = { version = "0.27", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
  "tokio-rustls-comp",
  "tls-rustls-webpki-roots",
  "cluster-async",
  "sentinel",
  "script",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
toml = "0.8"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
